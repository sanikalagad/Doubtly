# Application
spring.application.name=doubtly
server.port=8080

# Datasource (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/doubtly?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Database layer settings
doubtly.database.migration-enabled=true
doubtly.database.seed-enabled=false

# Security
jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret}
jwt.expiration-ms=86400000

# API documentation
springdoc.swagger-ui.path=/swagger-ui.html
